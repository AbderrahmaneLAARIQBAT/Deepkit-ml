[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepkit-ml"
version = "0.1.01"
description = "A machine learning library implemented from scratch"
requires-python = ">=3.10"
dependencies = [
    "numpy"
]

[tool.setuptools.packages.find]
where = ["src"]